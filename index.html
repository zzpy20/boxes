<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Storage Boxes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#F7F7F5;--surface:#FFFFFF;--surface-2:#F0EFEB;
      --border:rgba(0,0,0,0.07);--border-strong:rgba(0,0,0,0.13);
      --text:#0F0F0E;--muted:#787873;--accent:#0F0F0E;--accent-fg:#FFFFFF;
      --danger:#A32D2D;--danger-bg:#FCEBEB;--danger-border:#F7C1C1;
      --tag-bg:#EFEFEB;--tag-text:#3C3C38;--cover-bg:#EEECEA;
      --radius:16px;--radius-sm:10px;
      --font:'DM Sans',-apple-system,sans-serif;--mono:'DM Mono',monospace;
    }
    @media(prefers-color-scheme:dark){:root{
      --bg:#111110;--surface:#1C1C1A;--surface-2:#242422;
      --border:rgba(255,255,255,0.07);--border-strong:rgba(255,255,255,0.13);
      --text:#F0EFEB;--muted:#88887F;--accent:#F0EFEB;--accent-fg:#111110;
      --danger:#F7C1C1;--danger-bg:#501313;--danger-border:#A32D2D;
      --tag-bg:#2A2A27;--tag-text:#B8B8B0;--cover-bg:#252523;
    }}
    body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;}
    .page{max-width:1080px;margin:0 auto;padding:40px 24px 48px;}

    .header-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
    .site-title{font-size:24px;font-weight:600;letter-spacing:-0.3px;}
    .site-sub{font-size:13px;color:var(--muted);margin-top:3px;font-family:var(--mono);}
    .header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
    .status-pill{display:flex;align-items:center;gap:6px;background:#EAF3DE;color:#3B6D11;border:1px solid #C0DD97;font-size:12px;font-weight:500;padding:5px 12px;border-radius:20px;}
    @media(prefers-color-scheme:dark){.status-pill{background:#173404;color:#C0DD97;border-color:#3B6D11;}}
    .dot{width:7px;height:7px;border-radius:50%;background:#3B6D11;}
    @media(prefers-color-scheme:dark){.dot{background:#C0DD97;}}

    .btn{font-family:var(--font);font-size:13px;font-weight:500;padding:7px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer;transition:opacity 0.15s;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
    .btn:hover{opacity:0.7;}
    .btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);}
    .btn.danger{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-border);}
    .btn.sm{padding:5px 10px;font-size:12px;}
    .btn:disabled{opacity:0.4;cursor:not-allowed;}

    .search-wrap{position:relative;margin-bottom:8px;}
    .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none;}
    .search-input{font-family:var(--font);font-size:14px;width:100%;padding:11px 14px 11px 40px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text);outline:none;transition:border-color 0.15s;-webkit-appearance:none;}
    .search-input:focus{border-color:var(--border-strong);}
    .search-input::placeholder{color:var(--muted);}
    .search-meta{font-size:12px;color:var(--muted);font-family:var(--mono);margin-bottom:16px;min-height:18px;}

    .auth-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
    .auth-bar.hidden{display:none;}
    .auth-bar input{font-family:var(--font);flex:1;padding:8px 12px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:var(--bg);color:var(--text);font-size:14px;outline:none;min-width:160px;}
    .auth-bar input:focus{border-color:var(--text);}
    .auth-label{font-size:13px;color:var(--muted);white-space:nowrap;}
    .auth-msg{font-size:12px;font-family:var(--mono);color:var(--muted);}
    .auth-msg.ok{color:#3B6D11;}
    .auth-msg.err{color:var(--danger);}

    /* Admin toolbar */
    .admin-bar{display:none;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:16px;}
    .admin-bar.visible{display:flex;}
    .admin-label{font-size:12px;color:var(--muted);font-family:var(--mono);margin-right:4px;}
    .progress-bar-wrap{flex:1;min-width:120px;height:4px;background:var(--surface-2);border-radius:999px;overflow:hidden;display:none;}
    .progress-bar-wrap.visible{display:block;}
    .progress-bar-fill{height:100%;background:var(--accent);width:0%;transition:width 0.2s;border-radius:999px;}
    .progress-label{font-size:11px;color:var(--muted);font-family:var(--mono);}

    .counter{font-size:13px;color:var(--muted);font-family:var(--mono);margin-bottom:12px;}

    .grid{display:grid;gap:12px;margin-bottom:2rem;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));}

    a.card{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:border-color 0.15s,transform 0.1s;position:relative;}
    a.card:hover{border-color:var(--border-strong);transform:translateY(-2px);}
    a.card:active{transform:translateY(0);}
    a.card.hidden{display:none;}

    .cover{height:130px;background:var(--cover-bg);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
    .cover img{width:100%;height:100%;object-fit:cover;display:block;}
    .cover-placeholder{font-size:28px;opacity:0.35;}
    .cover-label{position:absolute;bottom:8px;left:8px;font-family:var(--mono);font-size:10px;font-weight:500;color:var(--muted);background:var(--surface);border:1px solid var(--border);padding:2px 7px;border-radius:999px;}

    /* Card admin overlay buttons */
    .card-admin{position:absolute;top:6px;right:6px;display:none;gap:4px;}
    .admin-bar.visible ~ .grid .card-admin{display:flex;}
    .card-admin-btn{width:26px;height:26px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;backdrop-filter:blur(4px);}
    .card-admin-btn.edit{background:rgba(255,255,255,0.85);color:#333;}
    .card-admin-btn.del{background:rgba(220,50,50,0.85);color:#fff;}
    @media(prefers-color-scheme:dark){.card-admin-btn.edit{background:rgba(40,40,38,0.85);color:#F0EFEB;}}

    .card-body{padding:12px 14px 14px;}
    .card-title{font-size:15px;font-weight:600;letter-spacing:-0.2px;margin-bottom:4px;}
    .card-desc{font-size:13px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:20px;}
    .card-tags{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px;}
    .tag{font-size:11px;font-weight:500;color:var(--tag-text);background:var(--tag-bg);padding:3px 8px;border-radius:999px;cursor:pointer;border:none;transition:opacity 0.15s;font-family:var(--font);}
    .tag:hover{opacity:0.7;}

    /* File search results */
    .results-section{margin-bottom:16px;display:none;}
    .results-section.visible{display:block;}
    .results-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.07em;color:var(--muted);margin-bottom:8px;}
    .result-item{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:6px;text-decoration:none;color:inherit;transition:border-color 0.15s;}
    .result-item:hover{border-color:var(--border-strong);}
    .result-icon{font-size:18px;flex-shrink:0;}
    .result-main{min-width:0;flex:1;}
    .result-name{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .result-caption{font-size:12px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .result-box{font-size:11px;color:var(--muted);font-family:var(--mono);flex-shrink:0;}

    /* Edit box modal */
    .modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);z-index:8000;padding:16px;}
    .modal.hidden{display:none;}
    .modal-card{width:min(500px,100%);background:var(--surface);border:1px solid var(--border-strong);border-radius:20px;overflow:hidden;max-height:90vh;overflow-y:auto;}
    .modal-head{padding:20px 20px 14px;border-bottom:1px solid var(--border);}
    .modal-title{font-size:16px;font-weight:600;}
    .modal-body{padding:16px 20px;}
    .modal-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin-bottom:6px;}
    .modal-input{font-family:var(--font);font-size:14px;width:100%;padding:9px 12px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:var(--bg);color:var(--text);outline:none;margin-bottom:14px;}
    .modal-input:focus{border-color:var(--text);}
    .modal-textarea{font-family:var(--font);font-size:14px;width:100%;padding:9px 12px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:var(--bg);color:var(--text);outline:none;margin-bottom:14px;resize:vertical;min-height:80px;}
    .modal-textarea:focus{border-color:var(--text);}
    .modal-foot{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
    .modal-foot-right{display:flex;gap:8px;}

    /* Cover picker inside modal */
    .cover-picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;margin-bottom:14px;max-height:200px;overflow-y:auto;}
    .cover-pick-item{aspect-ratio:1;border-radius:8px;overflow:hidden;cursor:pointer;border:2px solid transparent;transition:border-color 0.15s;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);text-align:center;word-break:break-all;padding:2px;}
    .cover-pick-item img{width:100%;height:100%;object-fit:cover;display:block;}
    .cover-pick-item.selected{border-color:var(--accent);}
    .cover-pick-item.none-item{font-size:20px;}

    .empty{text-align:center;color:var(--muted);font-size:14px;padding:32px;background:var(--surface);border:1px dashed var(--border-strong);border-radius:var(--radius);display:none;}
    footer{max-width:1080px;margin:0 auto;padding:16px 24px 32px;color:var(--muted);font-size:12px;font-family:var(--mono);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;border-top:1px solid var(--border);}
  </style>
</head>
<body>
<div class="page">
  <div class="header-top">
    <div>
      <div class="site-title">Storage Boxes</div>
      <div class="site-sub">boxes.1000600.xyz</div>
    </div>
    <div class="header-right">
      <div class="status-pill"><span class="dot"></span>Private · Cloudflare R2</div>
      <button class="btn" id="signOutBtn" style="display:none">Sign out</button>
    </div>
  </div>

  <!-- Auth -->
  <div class="auth-bar" id="authBar">
    <span class="auth-label">Passphrase:</span>
    <input type="password" id="passphraseInput" placeholder="Enter passphrase…" autocomplete="current-password" />
    <button class="btn primary" id="unlockBtn">Unlock</button>
    <span class="auth-msg" id="authMsg"></span>
  </div>

  <!-- Admin toolbar (shown when authenticated) -->
  <div class="admin-bar" id="adminBar">
    <span class="admin-label">Admin:</span>
    <button class="btn sm primary" id="addBoxBtn">+ Add box</button>
    <button class="btn sm" id="rebuildIndexBtn">↺ Rebuild search index</button>
    <div class="progress-bar-wrap" id="rebuildProgress"><div class="progress-bar-fill" id="rebuildFill"></div></div>
    <span class="progress-label" id="rebuildLabel"></span>
  </div>

  <!-- Search -->
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input class="search-input" id="q" type="search" placeholder="Search all boxes — files, notes, tags, captions…" autocomplete="off" />
  </div>
  <div class="search-meta" id="searchMeta"></div>

  <div class="results-section" id="fileResults">
    <div class="results-label">Files &amp; notes</div>
    <div id="fileResultsList"></div>
  </div>

  <div class="counter" id="counter">Loading…</div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">No results found.</div>
</div>

<!-- Edit box modal -->
<div class="modal hidden" id="editBoxModal">
  <div class="modal-card">
    <div class="modal-head"><div class="modal-title" id="editBoxTitle">Edit Box</div></div>
    <div class="modal-body">
      <div class="modal-label">Description (shown on home page)</div>
      <textarea class="modal-textarea" id="editBoxDesc" placeholder="Describe what's in this box…"></textarea>
      <div class="modal-label">Tags <span style="font-weight:400;text-transform:none;letter-spacing:0">(comma separated)</span></div>
      <input class="modal-input" id="editBoxTags" type="text" placeholder="e.g. clothes, winter, fragile" />
      <div class="modal-label">Cover image</div>
      <div class="cover-picker" id="coverPicker">
        <div class="cover-pick-item none-item selected" data-cover="">📦 None</div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn danger sm" id="deleteBoxBtn">Delete box</button>
      <div class="modal-foot-right">
        <button class="btn" id="editBoxCancel">Cancel</button>
        <button class="btn primary" id="editBoxSave">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- Add box modal -->
<div class="modal hidden" id="addBoxModal">
  <div class="modal-card">
    <div class="modal-head"><div class="modal-title">Add new box</div></div>
    <div class="modal-body">
      <div class="modal-label">Box number (e.g. 51)</div>
      <input class="modal-input" id="newBoxId" type="number" min="1" max="999" placeholder="51" />
      <div class="modal-label">Description</div>
      <textarea class="modal-textarea" id="newBoxDesc" placeholder="Describe what's in this box…"></textarea>
      <div class="modal-label">Tags <span style="font-weight:400;text-transform:none;letter-spacing:0">(comma separated)</span></div>
      <input class="modal-input" id="newBoxTags" type="text" placeholder="e.g. clothes, winter" />
    </div>
    <div class="modal-foot">
      <div></div>
      <div class="modal-foot-right">
        <button class="btn" id="addBoxCancel">Cancel</button>
        <button class="btn primary" id="addBoxSave">Add box</button>
      </div>
    </div>
  </div>
</div>

<footer>
  <span>zzpy20 · Cloudflare Pages</span>
  <span id="stamp"></span>
</footer>

<script>
const TOKEN_KEY="boxes_auth_token";
const WORKER_BASE="https://box-redirect.ausz.workers.dev/";
const GITHUB_REPO="zzpy20/boxes";
const GITHUB_API="https://api.github.com/repos/"+GITHUB_REPO+"/contents/boxes.json";

function getTok(){try{return(localStorage.getItem(TOKEN_KEY)||"").trim();}catch{return"";}}
function setTok(t){try{localStorage.setItem(TOKEN_KEY,t.trim());}catch{}}
function clearTok(){try{localStorage.removeItem(TOKEN_KEY);}catch{}}
function mediaFileUrl(id,name,t){var u=new URL(WORKER_BASE+"media/box-"+id+"/"+encodeURIComponent(name));u.searchParams.set("t",t);return u.toString();}
function mediaListUrl(id,t){var u=new URL(WORKER_BASE+"media/box-"+id+"/list");u.searchParams.set("t",t);return u.toString();}
function mediaNoteGetUrl(id,t){var u=new URL(WORKER_BASE+"media/box-"+id+"/note");u.searchParams.set("t",t);return u.toString();}
function mediaMetaGetUrl(id,t){var u=new URL(WORKER_BASE+"media/box-"+id+"/_meta");u.searchParams.set("t",t);return u.toString();}
function searchIndexUrl(t){var u=new URL(WORKER_BASE+"search-index");u.searchParams.set("t",t);return u.toString();}
function checkUrl(tok){var u=new URL(WORKER_BASE+"dummy");u.searchParams.set("t",tok);u.searchParams.set("check","1");return u.toString();}

document.getElementById("stamp").textContent=new Date().toISOString().slice(0,10);
const pad2=n=>String(n).padStart(2,"0");
const norm=s=>(s||"").toString().trim().toLowerCase();
function isImg(name){return["jpg","jpeg","png","gif","webp","avif"].includes((name||"").split(".").pop().toLowerCase());}
function escH(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

var TOKEN=getTok();
var searchIndex=[];
var allBoxes=[];
var boxesMeta={}; // {boxId: {cover, note, tags}}

function updateAuthUI(){
  var ab=document.getElementById("authBar");
  var so=document.getElementById("signOutBtn");
  var adm=document.getElementById("adminBar");
  if(TOKEN){ab.classList.add("hidden");so.style.display="";adm.classList.add("visible");}
  else{ab.classList.remove("hidden");so.style.display="none";adm.classList.remove("visible");}
}

document.getElementById("unlockBtn").addEventListener("click",async function(){
  var tok=document.getElementById("passphraseInput").value.trim();if(!tok)return;
  var msg=document.getElementById("authMsg");msg.textContent="Checking…";msg.className="auth-msg";
  try{
    var res=await fetch(checkUrl(tok));
    if(res.status===200){
      TOKEN=tok;setTok(tok);msg.textContent="✓ Authenticated";msg.className="auth-msg ok";
      updateAuthUI();
      await loadSearchIndex();
      setupCoverLazyLoader();
      doSearch();
    }else{msg.textContent="Incorrect passphrase";msg.className="auth-msg err";}
  }catch{msg.textContent="Error";msg.className="auth-msg err";}
});
document.getElementById("passphraseInput").addEventListener("keydown",function(e){if(e.key==="Enter")document.getElementById("unlockBtn").click();});
document.getElementById("signOutBtn").addEventListener("click",function(){
  clearTok();TOKEN="";searchIndex=[];updateAuthUI();
  document.querySelectorAll(".cover img").forEach(function(i){i.remove();});
  document.querySelectorAll(".cover-placeholder").forEach(function(p){p.style.display="";});
  doSearch();
});

async function loadSearchIndex(){
  if(!TOKEN)return;
  try{var res=await fetch(searchIndexUrl(TOKEN),{cache:"no-store"});if(res.ok)searchIndex=await res.json();else searchIndex=[];}
  catch{searchIndex=[];}
  // Update card descriptions from index
  searchIndex.forEach(function(entry){
    var card=document.querySelector('a.card[data-boxid="'+entry.boxId+'"]');
    if(!card)return;
    var desc=card.querySelector(".card-desc");
    if(desc&&entry.boxNote&&entry.boxNote.trim())desc.textContent=entry.boxNote.trim().slice(0,200);
    // Update cover if set
    if(entry.coverFile){
      var cover=card.querySelector(".cover");
      if(cover&&!cover.dataset.loaded){
        cover.dataset.loaded="1";
        var img=new Image();img.loading="lazy";
        img.src=mediaFileUrl(entry.boxId,entry.coverFile,TOKEN);
        var ph=cover.querySelector(".cover-placeholder");
        img.onload=function(){if(ph)ph.style.display="none";cover.insertBefore(img,cover.querySelector(".cover-label"));};
      }
    }
  });
}

// Rebuild search index - iterate all boxes
async function rebuildSearchIndex(){
  var btn=document.getElementById("rebuildIndexBtn");
  var prog=document.getElementById("rebuildProgress");
  var fill=document.getElementById("rebuildFill");
  var label=document.getElementById("rebuildLabel");
  btn.disabled=true;prog.classList.add("visible");
  var newIndex=[];
  for(var i=0;i<allBoxes.length;i++){
    var box=allBoxes[i];
    label.textContent=(i+1)+"/"+allBoxes.length+" BOX-"+box.id;
    fill.style.width=Math.round((i/allBoxes.length)*100)+"%";
    try{
      var [metaRes,noteRes,listRes]=await Promise.all([
        fetch(mediaMetaGetUrl(box.id,TOKEN),{cache:"no-store"}),
        fetch(mediaNoteGetUrl(box.id,TOKEN),{cache:"no-store"}),
        fetch(mediaListUrl(box.id,TOKEN),{cache:"no-store"})
      ]);
      var meta=metaRes.ok?await metaRes.json():{};
      var noteHtml=noteRes.ok?await noteRes.text():"";
      var noteText=noteHtml.replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim().slice(0,500);
      var files=[];
      if(listRes.ok){
        var arr=await listRes.json();
        if(Array.isArray(arr)){
          arr.forEach(function(f){
            var m=meta[f.name]||{};
            files.push({name:f.name,caption:m.caption||"",tags:m.tags||[]});
          });
        }
      }
      // Get existing cover setting
      var existingEntry=searchIndex.find(function(e){return e.boxId===box.id;});
      var coverFile=(existingEntry&&existingEntry.coverFile)||"";
      newIndex.push({boxId:box.id,boxNote:noteText,files:files,coverFile:coverFile});
    }catch(e){console.warn("BOX-"+box.id+" failed:",e);}
  }
  fill.style.width="100%";label.textContent="Saving…";
  await fetch(searchIndexUrl(TOKEN),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(newIndex)});
  searchIndex=newIndex;
  // Update card descriptions
  searchIndex.forEach(function(entry){
    var card=document.querySelector('a.card[data-boxid="'+entry.boxId+'"]');
    if(!card)return;
    var desc=card.querySelector(".card-desc");
    if(desc&&entry.boxNote&&entry.boxNote.trim())desc.textContent=entry.boxNote.trim().slice(0,200);
  });
  label.textContent="Done ✓";btn.disabled=false;
  setTimeout(function(){prog.classList.remove("visible");label.textContent="";fill.style.width="0%";},3000);
}

document.getElementById("rebuildIndexBtn").addEventListener("click",rebuildSearchIndex);

function setupCoverLazyLoader(){
  if(!TOKEN)return;
  var cards=[...document.querySelectorAll("a.card")];
  var queue=[],running=0,MAX=4;
  var pump=function(){while(running<MAX&&queue.length){var c=queue.shift();running++;loadCover(c).finally(function(){running--;pump();});}};
  var io=new IntersectionObserver(function(entries){entries.forEach(function(en){if(en.isIntersecting){io.unobserve(en.target);queue.push(en.target);}});pump();},{rootMargin:"200px"});
  cards.forEach(function(c){
    // Skip if already loaded via search index (cover set)
    if(!c.querySelector(".cover").dataset.loaded)io.observe(c);
  });
}

async function loadCover(card){
  var boxId=card.dataset.boxid;var cover=card.querySelector(".cover");
  if(!boxId||!cover||cover.dataset.loaded)return;
  // Check if search index has a cover for this box
  var entry=searchIndex.find(function(e){return e.boxId===boxId;});
  var coverFile=entry&&entry.coverFile;
  if(coverFile){
    cover.dataset.loaded="1";
    var img=new Image();img.loading="lazy";img.src=mediaFileUrl(boxId,coverFile,TOKEN);img.alt="BOX-"+boxId;
    var ph=cover.querySelector(".cover-placeholder");
    img.onload=function(){if(ph)ph.style.display="none";cover.insertBefore(img,cover.querySelector(".cover-label"));};
    return;
  }
  // Auto-detect: use first image
  cover.dataset.loaded="1";
  try{
    var res=await fetch(mediaListUrl(boxId,TOKEN),{cache:"no-store"});if(!res.ok)return;
    var arr=await res.json();
    var first=(Array.isArray(arr)?arr:[]).map(function(x){return x.name;}).find(isImg);
    if(!first)return;
    var img2=new Image();img2.loading="lazy";img2.src=mediaFileUrl(boxId,first,TOKEN);img2.alt="BOX-"+boxId;
    var ph2=cover.querySelector(".cover-placeholder");
    img2.onload=function(){if(ph2)ph2.style.display="none";cover.insertBefore(img2,cover.querySelector(".cover-label"));};
  }catch{}
}

// Edit box modal
var editingBoxId=null;
async function openEditBoxModal(boxId){
  editingBoxId=boxId;
  var box=allBoxes.find(function(b){return b.id===boxId;});
  document.getElementById("editBoxTitle").textContent="Edit BOX-"+boxId;
  // Get current note from search index
  var entry=searchIndex.find(function(e){return e.boxId===boxId;});
  document.getElementById("editBoxDesc").value=(entry&&entry.boxNote)||box.note||"";
  document.getElementById("editBoxTags").value=(box.tags||[]).join(", ");
  // Load cover picker
  var picker=document.getElementById("coverPicker");
  picker.innerHTML='<div class="cover-pick-item none-item'+((!entry||!entry.coverFile)?" selected":"")+ '" data-cover="">📦 No cover</div>';
  var currentCover=(entry&&entry.coverFile)||"";
  // Load images for this box
  try{
    var res=await fetch(mediaListUrl(boxId,TOKEN),{cache:"no-store"});
    if(res.ok){
      var arr=await res.json();
      var imgs=(Array.isArray(arr)?arr:[]).filter(function(f){return isImg(f.name);});
      imgs.forEach(function(f){
        var item=document.createElement("div");item.className="cover-pick-item"+(f.name===currentCover?" selected":"");item.dataset.cover=f.name;
        var img=document.createElement("img");img.src=mediaFileUrl(boxId,f.name,TOKEN);img.alt=f.name;img.loading="lazy";
        item.appendChild(img);
        item.addEventListener("click",function(){picker.querySelectorAll(".cover-pick-item").forEach(function(i){i.classList.remove("selected");});item.classList.add("selected");});
        picker.appendChild(item);
      });
    }
  }catch{}
  picker.querySelector(".none-item").addEventListener("click",function(){
    picker.querySelectorAll(".cover-pick-item").forEach(function(i){i.classList.remove("selected");});
    picker.querySelector(".none-item").classList.add("selected");
  });
  document.getElementById("editBoxModal").classList.remove("hidden");
}

document.getElementById("editBoxCancel").addEventListener("click",function(){document.getElementById("editBoxModal").classList.add("hidden");});
document.getElementById("editBoxModal").addEventListener("click",function(e){if(e.target===this)this.classList.add("hidden");});

document.getElementById("editBoxSave").addEventListener("click",async function(){
  var btn=this;btn.disabled=true;
  var desc=document.getElementById("editBoxDesc").value.trim();
  var tags=document.getElementById("editBoxTags").value.split(",").map(function(t){return t.trim();}).filter(Boolean);
  var selectedCover=document.querySelector("#coverPicker .cover-pick-item.selected");
  var coverFile=selectedCover?selectedCover.dataset.cover:"";
  // Update boxes.json note/tags
  var box=allBoxes.find(function(b){return b.id===editingBoxId;});
  if(box){box.note=desc;box.tags=tags;}
  // Update search index entry
  var idx=searchIndex.findIndex(function(e){return e.boxId===editingBoxId;});
  if(idx>=0){searchIndex[idx].boxNote=desc;searchIndex[idx].coverFile=coverFile;}
  else{searchIndex.push({boxId:editingBoxId,boxNote:desc,files:[],coverFile:coverFile});}
  // Save search index
  await fetch(searchIndexUrl(TOKEN),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(searchIndex)});
  // Update card
  var card=document.querySelector('a.card[data-boxid="'+editingBoxId+'"]');
  if(card){
    var descEl=card.querySelector(".card-desc");if(descEl)descEl.textContent=desc||"No description";
    var tagsEl=card.querySelector(".card-tags");if(tagsEl){tagsEl.innerHTML="";tags.forEach(function(t){var s=document.createElement("span");s.className="tag";s.textContent=t;s.addEventListener("click",function(e){e.preventDefault();e.stopPropagation();filterByTag(t);});tagsEl.appendChild(s);});}
    card.dataset.search=["box-"+editingBoxId,editingBoxId,desc,tags.join(" ")].join(" ").toLowerCase();
    // Update cover
    var cover=card.querySelector(".cover");
    if(cover){
      cover.dataset.loaded="";
      var oldImg=cover.querySelector("img");if(oldImg)oldImg.remove();
      var ph=cover.querySelector(".cover-placeholder");if(ph)ph.style.display="";
      if(coverFile){
        cover.dataset.loaded="1";
        var img=new Image();img.loading="lazy";img.src=mediaFileUrl(editingBoxId,coverFile,TOKEN);img.alt="BOX-"+editingBoxId;
        img.onload=function(){if(ph)ph.style.display="none";cover.insertBefore(img,cover.querySelector(".cover-label"));};
      }
    }
  }
  document.getElementById("editBoxModal").classList.add("hidden");
  btn.disabled=false;
});

document.getElementById("deleteBoxBtn").addEventListener("click",async function(){
  if(!confirm("Remove BOX-"+editingBoxId+" from the list? (Files in R2 are not deleted)"))return;
  allBoxes=allBoxes.filter(function(b){return b.id!==editingBoxId;});
  searchIndex=searchIndex.filter(function(e){return e.boxId!==editingBoxId;});
  await fetch(searchIndexUrl(TOKEN),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(searchIndex)});
  render(allBoxes);
  document.getElementById("editBoxModal").classList.add("hidden");
  // Note: boxes.json on GitHub not auto-updated; user needs to manually update or we show a note
  alert("BOX-"+editingBoxId+" removed from view. Remember to update boxes.json to make permanent.");
});

// Add box
document.getElementById("addBoxBtn").addEventListener("click",function(){
  document.getElementById("newBoxId").value="";
  document.getElementById("newBoxDesc").value="";
  document.getElementById("newBoxTags").value="";
  document.getElementById("addBoxModal").classList.remove("hidden");
  document.getElementById("newBoxId").focus();
});
document.getElementById("addBoxCancel").addEventListener("click",function(){document.getElementById("addBoxModal").classList.add("hidden");});
document.getElementById("addBoxModal").addEventListener("click",function(e){if(e.target===this)this.classList.add("hidden");});
document.getElementById("addBoxSave").addEventListener("click",function(){
  var idVal=document.getElementById("newBoxId").value.trim();
  var num=parseInt(idVal,10);
  if(!num||num<1){alert("Please enter a valid box number.");return;}
  var newId=pad2(num);
  if(allBoxes.find(function(b){return b.id===newId;})){alert("BOX-"+newId+" already exists.");return;}
  var desc=document.getElementById("newBoxDesc").value.trim();
  var tags=document.getElementById("newBoxTags").value.split(",").map(function(t){return t.trim();}).filter(Boolean);
  var newBox={id:newId,key:"",note:desc,tags:tags};
  allBoxes.push(newBox);
  allBoxes.sort(function(a,b){return parseInt(a.id,10)-parseInt(b.id,10);});
  render(allBoxes);
  document.getElementById("addBoxModal").classList.add("hidden");
  alert("BOX-"+newId+" added! Remember to update boxes.json to make permanent.");
});

// Search
var searchTerm="";
function doSearch(){
  var term=norm(searchTerm);
  var counter=document.getElementById("counter");
  var empty=document.getElementById("empty");
  var fileResults=document.getElementById("fileResults");
  var fileResultsList=document.getElementById("fileResultsList");
  var searchMeta=document.getElementById("searchMeta");

  if(!term){
    document.querySelectorAll("a.card").forEach(function(c){c.classList.remove("hidden");});
    counter.textContent=allBoxes.length+" boxes";
    empty.style.display="none";
    fileResults.classList.remove("visible");fileResultsList.innerHTML="";
    searchMeta.textContent=TOKEN?"":"Sign in above to search files, notes & captions across all boxes";
    return;
  }

  var boxMatches=0;
  document.querySelectorAll("a.card").forEach(function(card){
    var match=card.dataset.search.includes(term);
    card.classList.toggle("hidden",!match);
    if(match)boxMatches++;
  });

  fileResultsList.innerHTML="";var fileMatches=[];
  if(TOKEN&&searchIndex.length>0){
    searchIndex.forEach(function(entry){
      if(entry.boxNote&&norm(entry.boxNote).includes(term)){
        fileMatches.push({boxId:entry.boxId,name:"Notes · BOX-"+entry.boxId,caption:entry.boxNote.slice(0,80),type:"note"});
      }
      (entry.files||[]).forEach(function(f){
        var nm=norm(f.name).includes(term);
        var cp=f.caption&&norm(f.caption).includes(term);
        var tg=(f.tags||[]).some(function(t){return norm(t).includes(term);});
        if(nm||cp||tg)fileMatches.push({boxId:entry.boxId,name:f.name,caption:cp?f.caption:(f.tags||[]).join(", "),type:"file"});
      });
    });
  }

  if(fileMatches.length>0){
    fileResults.classList.add("visible");
    fileMatches.slice(0,20).forEach(function(r){
      var a=document.createElement("a");a.className="result-item";a.href="box/?id="+r.boxId;
      var icon=r.type==="note"?"📝":"📎";
      a.innerHTML='<div class="result-icon">'+icon+'</div><div class="result-main"><div class="result-name">'+escH(r.name)+'</div>'+(r.caption?'<div class="result-caption">'+escH(r.caption.slice(0,80))+'</div>':'')+' </div><div class="result-box">BOX-'+r.boxId+'</div>';
      fileResultsList.appendChild(a);
    });
  }else{fileResults.classList.remove("visible");}

  counter.textContent=boxMatches+" box"+(boxMatches===1?"":"es")+(fileMatches.length>0?", "+fileMatches.length+" file match"+(fileMatches.length===1?"":"es"):"");
  searchMeta.textContent=(!TOKEN&&term)?"Sign in to also search file names, notes & captions":"";
  empty.style.display=(boxMatches+fileMatches.length===0)?"block":"none";
}
document.getElementById("q").addEventListener("input",function(){searchTerm=this.value;doSearch();});

function filterByTag(tag){document.getElementById("q").value=tag;searchTerm=tag;doSearch();}

const coerceTags=tags=>{
  if(Array.isArray(tags))return tags.map(t=>String(t).trim()).filter(Boolean);
  if(typeof tags==="string")return tags.split(/[;,]/g).flatMap(p=>p.split(/\s+/g)).map(t=>t.trim()).filter(Boolean);
  return[];
};

function makeCard(box){
  var a=document.createElement("a");a.className="card";a.href="box/?id="+box.id;a.dataset.boxid=box.id;

  var cover=document.createElement("div");cover.className="cover";
  var ph=document.createElement("div");ph.className="cover-placeholder";ph.textContent="📦";
  var lbl=document.createElement("div");lbl.className="cover-label";lbl.textContent="BOX-"+box.id;
  cover.appendChild(ph);cover.appendChild(lbl);

  // Admin overlay buttons
  var adminBtns=document.createElement("div");adminBtns.className="card-admin";
  var editBtn=document.createElement("button");editBtn.className="card-admin-btn edit";editBtn.title="Edit";editBtn.textContent="✎";
  editBtn.addEventListener("click",function(e){e.preventDefault();e.stopPropagation();openEditBoxModal(box.id);});
  adminBtns.appendChild(editBtn);

  var body=document.createElement("div");body.className="card-body";
  var title=document.createElement("div");title.className="card-title";title.textContent="BOX-"+box.id;
  var desc=document.createElement("div");desc.className="card-desc";desc.textContent=box.note||"No description";
  body.appendChild(title);body.appendChild(desc);

  if(box.tags&&box.tags.length){
    var tw=document.createElement("div");tw.className="card-tags";
    box.tags.forEach(function(tag){
      var s=document.createElement("span");s.className="tag";s.textContent=tag;
      s.addEventListener("click",function(e){e.preventDefault();e.stopPropagation();filterByTag(tag);});tw.appendChild(s);
    });
    body.appendChild(tw);
  }

  a.appendChild(cover);a.appendChild(adminBtns);a.appendChild(body);
  a.dataset.search=["box-"+box.id,box.id,box.note||"",coerceTags(box.tags).join(" ")].join(" ").toLowerCase();
  return a;
}

function render(list){
  var grid=document.getElementById("grid");grid.innerHTML="";
  list.forEach(function(b){grid.appendChild(makeCard(b));});
  document.getElementById("counter").textContent=list.length+" boxes";
  if(TOKEN)setupCoverLazyLoader();
}

async function loadBoxes(){
  var res=await fetch("boxes.json",{cache:"no-store"});
  if(!res.ok)throw new Error("boxes.json not found");
  var data=await res.json();
  var list=Array.isArray(data.boxes)?data.boxes:[];
  return list.map(function(r){return{id:pad2(parseInt(r.id,10)),key:(r.key||"").trim(),note:(r.note||""),tags:coerceTags(r.tags)};})
    .sort(function(a,b){return parseInt(a.id,10)-parseInt(b.id,10);});
}

(async function(){
  try{
    allBoxes=await loadBoxes();render(allBoxes);updateAuthUI();
    if(TOKEN){await loadSearchIndex();setupCoverLazyLoader();}
    doSearch();
  }catch(e){console.error(e);}
})();
</script>
